# Docker Compose — PRODUCTION (le développement passe par Sail : compose.yaml).
#
# Premier lancement :
#   cp .env.production.example .env.production   # puis remplir APP_KEY, APP_URL, DB_PASSWORD
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# --env-file sert à l'interpolation des ${...} ci-dessous ; env_file les transmet aux conteneurs.

x-app: &app
    build:
        context: .
        target: runtime
    image: muse:latest
    restart: unless-stopped
    env_file: .env.production
    networks:
        - muse

services:
    app:
        <<: *app
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            # storage/app entier : private (vidéos des groupes, disque local) ET public (images des musées).
            - storage_app:/var/www/html/storage/app
        depends_on:
            mysql:
                condition: service_healthy

    queue:
        <<: *app
        # Exécuté en www-data : les fichiers produits (vidéos, transcriptions) gardent le même propriétaire que ceux de php-fpm.
        user: www-data
        # --timeout = plus long $timeout des jobs (TranscrireVideo : 900 s) ; DB_QUEUE_RETRY_AFTER doit le dépasser.
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--timeout=900']
        # Laisse un job FFmpeg/Whisper en cours se terminer lors d'un redéploiement.
        stop_grace_period: 15m
        healthcheck:
            disable: true
        volumes:
            - storage_app:/var/www/html/storage/app
            - whisper_models:/opt/cache/whisper
        depends_on:
            # app exécute les migrations au démarrage : on attend qu'il réponde avant de consommer la file.
            app:
                condition: service_healthy

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - muse
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    muse:
        driver: bridge

volumes:
    mysql_data:
    storage_app:
    whisper_models:
