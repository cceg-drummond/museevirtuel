<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes – Accueil enseignant · Musée virtuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;font-size:14px;color:var(--fg);background:var(--page)}
a{color:inherit;text-decoration:none}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ───────── Thèmes ───────── */
.v-a{--page:hsl(0 0% 98%);--bg:#fff;--fg:hsl(0 0% 9%);--muted:hsl(0 0% 45%);--soft:hsl(0 0% 96%);--border:hsl(0 0% 91%);--primary:hsl(0 0% 9%);--primary-fg:#fff;--accent:#c9a040;--blue:#3b82f6;--green:#16a34a;--amber:#d97706;--sb-bg:hsl(0 0% 98%);--sb-fg:hsl(240 5% 26%);--sb-active:hsl(0 0% 93%);--sb-muted:hsl(0 0% 55%);
  --il-sky1:#f6efe1;--il-sky2:#e7eefb;--il-ground:#e8dfcc;--il-text:#171717;--il-sub:#6b5a2e;--il-accent:#c9a040;--il-blazer:#334155;--il-glow:#ffffff}
.v-b{--page:#0a0a1e;--bg:#12132b;--fg:#e9e6f5;--muted:rgba(210,210,230,.6);--soft:rgba(255,255,255,.04);--border:rgba(201,160,64,.16);--primary:#c9a040;--primary-fg:#0e0e24;--accent:#c9a040;--blue:#5b9ff8;--green:#4ade80;--amber:#fbbf24;--sb-bg:#0c0c22;--sb-fg:#c8c8dc;--sb-active:rgba(201,160,64,.14);--sb-muted:rgba(200,200,220,.4);
  --il-sky1:#191a3c;--il-sky2:#0f1e30;--il-ground:#22233f;--il-text:#e8d5a3;--il-sub:#c9a040;--il-accent:#c9a040;--il-blazer:#5b6b8f;--il-glow:#c9a040}
.v-c{--page:#f4f5f7;--bg:#fff;--fg:#111827;--muted:#6b7280;--soft:#f3f4f6;--border:#e5e7eb;--primary:#1d4ed8;--primary-fg:#fff;--accent:#1d4ed8;--blue:#2563eb;--green:#059669;--amber:#d97706;--sb-bg:#111827;--sb-fg:#d1d5db;--sb-active:#1f2937;--sb-muted:#6b7280;
  --il-sky1:#e0e9ff;--il-sky2:#f5f7ff;--il-ground:#d6def0;--il-text:#1e3a8a;--il-sub:#1d4ed8;--il-accent:#2563eb;--il-blazer:#1e293b;--il-glow:#ffffff}
.v-d{--page:#f7f5f0;--bg:#fff;--fg:#1c1917;--muted:#78716c;--soft:#f5f5f4;--border:#e7e5e4;--primary:#0f766e;--primary-fg:#fff;--accent:#0f766e;--blue:#2563eb;--green:#15803d;--amber:#b45309;--sb-bg:#fff;--sb-fg:#44403c;--sb-active:#ecfdf5;--sb-muted:#a8a29e;
  --il-sky1:#fdf4e7;--il-sky2:#e6f4f1;--il-ground:#efe3cf;--il-text:#134e4a;--il-sub:#b45309;--il-accent:#0f766e;--il-blazer:#7c2d12;--il-glow:#ffffff}

/* ───────── Shell ───────── */
.app{display:flex;min-height:100vh;background:var(--page)}
.sb{width:256px;flex-shrink:0;background:var(--sb-bg);color:var(--sb-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:32px;height:32px;border-radius:7px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;flex-shrink:0}
.logo svg{width:18px;height:18px}
.brand{font-weight:600;font-size:13px;line-height:1.2}
.brand small{display:block;font-weight:400;color:var(--sb-muted);font-size:11.5px}
.sb-group{padding:6px 8px}
.sb-label{font-size:11px;font-weight:500;color:var(--sb-muted);padding:6px 8px;text-transform:none}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:13.5px;cursor:pointer}
.sb-item:hover{background:var(--sb-active)}
.sb-item.on{background:var(--sb-active);font-weight:600}
.sb-item .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff}
.sb-foot{margin-top:auto;padding:8px;border-top:1px solid var(--border)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.nav{height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:5}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;cursor:pointer;position:relative;background:none}
.icon-btn:hover{background:var(--soft)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:#ef4444;border:2px solid var(--bg)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px}
.crumbs a:hover{color:var(--fg)}
.crumbs .cur{color:var(--fg);font-weight:500}
.crumbs svg.i{width:14px;height:14px}
.sep-v{width:1px;height:22px;background:var(--border)}
.spacer{flex:1}
.search{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 10px;height:34px;width:230px;color:var(--muted);font-size:13px;background:var(--soft)}
.search kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px;background:var(--bg)}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--primary);color:var(--primary-fg);flex-shrink:0}
.uname{line-height:1.2}
.uname b{display:block;font-size:13.5px;font-weight:600}
.uname span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;font-weight:500;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.danger{color:#dc2626;border-color:rgba(220,38,38,.3)}
.btn.danger:hover{background:rgba(220,38,38,.07)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.content{padding:24px;display:flex;flex-direction:column;gap:20px}

/* ───────── Composants ───────── */
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.card-h h3{font-size:15px;font-weight:600}
.card-h>a,.card-h>.link{white-space:nowrap;flex-shrink:0}
.tag{white-space:nowrap}
.card-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
.card-b{padding:12px 18px 18px}
.link{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.link:hover{color:var(--fg)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}.g-3-2{grid-template-columns:3fr 2fr}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:500}
.kpi-val{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi-sub{font-size:12px;color:var(--muted)}
.up{color:var(--green);font-weight:600}.warn{color:var(--amber);font-weight:600}
.hero{overflow:hidden;border-radius:14px;border:1px solid var(--border);background:var(--bg)}
.hero svg.ill{display:block;width:100%;height:auto}
.heading h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.heading p{color:var(--muted);margin-top:3px}
.row-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:12px;color:var(--muted)}
.mini-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--soft);color:var(--fg);border:1px solid var(--border);flex-shrink:0}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--border);color:var(--muted);margin-right:4px}
.date-box{width:44px;text-align:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.date-box small{display:block;font-size:10px;font-weight:600;text-transform:uppercase;background:var(--primary);color:var(--primary-fg);padding:2px 0}
.date-box b{display:block;font-size:16px;padding:2px 0}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;margin-top:22px;border-bottom:1px solid var(--border)}
.bar-labels{display:flex;gap:14px;margin-top:6px}.bar-labels label{flex:1;font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .col{width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:var(--accent);position:relative}
.bar .col span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600}
.bar label{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.goal{position:relative}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.5}
.goal-line em{position:absolute;right:0;top:-17px;font-size:11px;color:var(--muted);font-style:normal}
.prog{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;border:1px solid var(--border)}
.prog i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.prow{display:flex;flex-direction:column;gap:6px;padding:9px 0}
.prow-h{display:flex;justify-content:space-between;font-size:13px}
.prow-h span{color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{margin-left:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:0}
.ok{color:var(--green)}.no{color:var(--muted)}

/* ───────── Variante A : sidebar inset (fidèle au layout actuel) ───────── */
.v-a .app{background:var(--sb-bg)}
.v-a .main{margin:8px 8px 8px 0;border-radius:14px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border);overflow:hidden}
.v-a .nav{border-radius:14px 14px 0 0}
.v-a .content{background:var(--bg)}
.v-a .bar .col{background:hsl(0 0% 15%)}
.v-a .bar:nth-child(4) .col{background:var(--accent)}

/* ───────── Variante B : L'Archive (sombre / or) ───────── */
.v-b .app{background:linear-gradient(160deg,#0a0a1e,#111228 50%,#0e0e28)}
.v-b .sb{border-right:1px solid var(--border)}
.v-b .nav{background:rgba(12,12,34,.85);backdrop-filter:blur(8px)}
.v-b .card,.v-b .hero{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border-color:var(--border)}
.v-b .kpi-val{color:#e8d5a3;font-family:'Instrument Serif',serif;font-weight:400;font-size:36px}
.v-b .sb-item.on{color:#e8d5a3;box-shadow:inset 2px 0 0 var(--accent)}
.v-b .heading h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:34px;color:#e8d5a3}
.v-b .surtitre{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(201,160,64,.75);font-weight:600}
.v-b .mini-av{background:rgba(201,160,64,.12);border-color:rgba(201,160,64,.3);color:#e8d5a3}
.v-b .btn{background:transparent}
.v-b .btn.primary{background:var(--accent);color:#0e0e24}
.v-b .avatar{background:linear-gradient(135deg,#c9a040,#8a6a20);color:#0e0e24}
.v-b .search{background:rgba(255,255,255,.04)}
.v-b .date-box small{background:var(--accent);color:#0e0e24}
.v-b .kpi-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(201,160,64,.12);color:var(--accent)}

/* ───────── Variante C : rail d'icônes + analytique ───────── */
.v-c .sb{width:92px;align-items:stretch}
.v-c .sb-head{flex-direction:column;padding:16px 8px 12px;gap:6px}
.v-c .sb-head .brand{display:none}
.v-c .logo{background:#2563eb}
.v-c .sb-group{padding:4px 8px}
.v-c .sb-label{display:none}
.v-c .sb-group+.sb-group{border-top:1px solid #1f2937;margin-top:4px;padding-top:8px}
.v-c .sb-item{flex-direction:column;gap:4px;font-size:10.5px;padding:8px 2px;text-align:center;line-height:1.15;position:relative}
.v-c .sb-item svg.i{width:19px;height:19px}
.v-c .sb-item.on{background:#1e3a8a;color:#fff;font-weight:600}
.v-c .sb-item .badge{position:absolute;top:3px;right:10px;margin:0;font-size:9.5px;padding:0 5px;background:#ef4444}
.v-c .sb-foot{border-color:#1f2937}
.v-c .kpi{gap:2px}
.v-c .kpi-val{font-size:24px}
.v-c .spark{display:block;width:100%;height:30px;margin-top:6px}
.v-c .hero{border:0;background:transparent}
.v-c .hero-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px}
.v-c .gauge-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}

/* ───────── Variante D : pilotage (sidebar claire + À faire) ───────── */
.v-d .sb{border-right:1px solid var(--border)}
.v-d .sb-item.on{color:#0f766e;background:#ecfdf5}
.v-d .sb-item.on svg.i{color:#0f766e}
.v-d .sb-item .badge{background:#f59e0b}
.v-d .sb-cta{margin:4px 14px 8px}
.v-d .sb-cta .btn{width:100%;justify-content:center}
.v-d .nav{background:rgba(255,255,255,.9)}
.v-d .hero{position:relative}
.v-d .hero-greet{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg)}
.v-d .hero-greet h1{font-size:19px;font-weight:700}
.v-d .hero-greet p{font-size:12.5px;color:var(--muted);margin-top:2px}
.v-d .tile{padding:16px;display:flex;gap:14px;align-items:center}
.v-d .tile-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.v-d .tile-ico svg.i{width:20px;height:20px}
.v-d .todo{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.v-d .todo:first-child{border-top:0}
.v-d .chk{width:18px;height:18px;border:1.5px solid var(--border);border-radius:5px;flex-shrink:0;margin-top:1px}
.v-d .todo b{font-size:13.5px;display:block}
.v-d .todo span{font-size:12px;color:var(--muted)}
.v-d .pill{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;flex-shrink:0}
.v-d .timeline{position:relative;padding-left:18px}
.v-d .timeline:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border)}
.v-d .tl{position:relative;padding:0 0 14px}
.v-d .tl:before{content:'';position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.v-d .tl b{font-size:13px}
.v-d .tl span{display:block;font-size:12px;color:var(--muted)}

/* ───────── Sélecteur de maquettes ───────── */
.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:5px;border-radius:999px;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.3);font-family:'Instrument Sans',sans-serif}
.switcher button{border:0;background:transparent;color:#bbb;font:500 13px 'Instrument Sans',sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.switcher button.on{background:#fff;color:#111}
.switcher button b{font-weight:700;margin-right:4px}

@media (max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.search{display:none}}
@media (max-width:980px){.g3,.g-2-1,.g-3-2,.g2,.v-c .hero-wrap{grid-template-columns:1fr}.uname{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
/* ───────────────────────── Icônes (lucide) ───────────────────────── */
const P = {
  dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',

  folder:'<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M8 10v4"/><path d="M12 10v2"/><path d="M16 10v6"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  elder:'<circle cx="10" cy="8" r="5"/><path d="M2 21a8 8 0 0 1 13.29-6"/><path d="m16 19 2 2 4-4"/>',
  video:'<path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/>',
  cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  museum:'<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/>',
  check:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',

function donut(size=150){
  const tot=STATUT.reduce((a,s)=>a+s[1],0), r=54, C=2*Math.PI*r; let off=0;
  const arcs=STATUT.map(([l,n,c])=>{const len=n/tot*C;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${len-2} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
  return `<div style="display:flex;align-items:center;gap:22px">
    <svg viewBox="0 0 140 140" width="${size}" height="${size}">${arcs}<text x="70" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">${tot}</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="currentColor" opacity=".55">projets</text></svg>
    <div class="legend" style="flex:1">${STATUT.map(([l,n,c])=>`<div><i style="background:${c}"></i>${l}<b>${n}</b></div>`).join('')}</div>

}

/* ───────────────────────── Variante C · Analytique ───────────────────────── */
function spark(pts,color){
  const w=160,h=30,max=Math.max(...pts),min=Math.min(...pts);
  const p=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-3-(v-min)/(max-min||1)*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function gauge(v){
  const r=70, C=Math.PI*r, len=v/100*C;
  return `<svg viewBox="0 0 180 104" width="200"><path d="M20 94 A70 70 0 0 1 160 94" fill="none" stroke="#e5e7eb" stroke-width="16" stroke-linecap="round"/><path d="M20 94 A70 70 0 0 1 160 94" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round" stroke-dasharray="${len} ${C}"/><text x="90" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">${String(v).replace('.',',')}</text></svg>`;
}

/* ───────────────────────── Rendu ───────────────────────── */
const VARIANTS = {
  a:['A','Sobre',contentA],
  b:['B','L’Archive',contentB],
  c:['C','Analytique',contentC],
  d:['D','Pilotage',contentD],
};
function render(v){
  document.getElementById('root').innerHTML = `<div class="v-${v}" style="color:var(--fg)"><div class="app">${sidebar(v)}<div class="main">${navbar(v)}<main class="content">${VARIANTS[v][2]()}</main></div></div></div>`;
  document.body.style.background = getComputedStyle(document.querySelector('.v-'+v)).getPropertyValue('--page');
  document.querySelectorAll('#switcher button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  try{ history.replaceState(null,'','#'+v) }catch(e){}
  window.scrollTo(0,0);
}
document.getElementById('switcher').innerHTML = Object.entries(VARIANTS).map(([k,[l,n]])=>`<button data-v="${k}"><b>${l}</b>${n}</button>`).join('');
document.getElementById('switcher').addEventListener('click',e=>{const b=e.target.closest('button');if(b)render(b.dataset.v)});
const h0=location.hash.slice(1);render(h0 in VARIANTS ? h0 : 'a');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h in VARIANTS&&!document.querySelector('.v-'+h))render(h)});
</script>
