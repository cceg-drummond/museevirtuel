; Surcharges PHP de production (chargées après les valeurs par défaut de l'image).

; Uploads vidéo des groupes — cohérent avec client_max_body_size de nginx.
post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 512M

; Laisse les variables d'environnement Docker visibles par Laravel.
variables_order = EGPCS

; Le code ne change pas dans un conteneur : inutile de revérifier les fichiers.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
